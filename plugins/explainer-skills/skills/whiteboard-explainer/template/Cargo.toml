[package]
name = "explainer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# `3d`: fframes::three_d (used by the optional src/t3d.rs); `wgpu`: 3D renders on the GPU and is read back into
# the CPU frame renderer (set FF_3D=cpu to render 3D on the CPU instead).
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli", "3d", "wgpu"] }

[lib]
name = "explainer_video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "explainer"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Fast rebuilds while drawing scenes (a scene edit rebuilds in ~25 s instead of ~50 s).
[profile.release]
incremental = true
codegen-units = 256
